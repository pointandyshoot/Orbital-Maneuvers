<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071016">
  <title>Orbital Command</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <div id="app">
    <header class="mast">
      <div class="identity"><span class="insignia"><i></i></span><div><span class="eyebrow">EARTH ORBITAL OPERATIONS</span><strong>ORBITAL COMMAND</strong></div></div>
      <div id="mast-actions"></div>
    </header>
    <section id="lobby">
      <canvas id="lobby-map" aria-hidden="true"></canvas>
      <div id="lobby-content"></div>
    </section>
    <div id="campaign" hidden>
      <div id="topbar"></div>
      <nav id="nav" aria-label="Command stations"></nav>
      <main id="workspace">
        <section id="command" class="station" aria-label="Orbital command map">
          <div class="command-layout">
            <div class="map-panel">
              <div class="map-header"><div><span class="eyebrow">TACTICAL DISPLAY</span><h1>Orbital theatre</h1></div><div id="map-modes"><button data-layer="tracks" aria-pressed="true">Tracks</button><button data-layer="coverage" aria-pressed="false">Coverage</button></div></div>
              <div class="map-frame"><canvas id="orbit-map" aria-label="Ground tracks and spacecraft positions" role="img"></canvas></div>
              <div id="map-footer"></div>
            </div>
            <aside id="command-side"></aside>
            <div id="command-bottom"></div>
          </div>
        </section>
        <section id="design" class="station" hidden></section>
        <section id="research" class="station" hidden></section>
        <section id="launch" class="station" hidden></section>
        <section id="intelligence" class="station" hidden></section>
        <section id="economy" class="station" hidden></section>
      </main>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
